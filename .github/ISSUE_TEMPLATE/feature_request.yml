name: Feature request
description: Suggest a focused improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
      description: For layout changes, include a sketch and the affected radio/screen size.
    validations:
      required: true
